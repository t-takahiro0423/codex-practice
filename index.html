<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI勉強会 告知ページ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      color-scheme: light;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --accent: #4f46e5;
      --accent-soft: rgba(79, 70, 229, 0.12);
      --shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", "Noto Sans JP", system-ui, sans-serif;
      color: var(--text-primary);
      background: linear-gradient(160deg, #eef2ff 0%, #ffffff 50%, #fdf2f8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px 64px;
    }

    .page {
      width: min(100%, 980px);
      background: var(--surface);
      border-radius: 32px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hero {
      position: relative;
      height: 360px;
      display: flex;
      align-items: flex-end;
      padding: 40px;
      background-image:
        linear-gradient(130deg, rgba(15, 23, 42, 0.05), rgba(79, 70, 229, 0.4)),
        url("https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1400&q=80");
      background-size: cover;
      background-position: center;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0) 10%, rgba(15, 23, 42, 0.5) 100%);
    }

    .hero-content {
      position: relative;
      color: #ffffff;
      z-index: 1;
      max-width: 520px;
    }

    .hero-title {
      font-size: clamp(28px, 3.2vw, 36px);
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: 0.02em;
    }

    .hero-subtitle {
      font-size: 16px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.85);
    }

    .content {
      background: var(--surface-alt);
      padding: 32px 40px 40px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      margin-top: -20px;
      margin-bottom: 20px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .info-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px 22px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    .info-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    .info-value {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .hero {
        height: 300px;
        padding: 24px;
      }

      .content {
        padding: 24px;
      }

      .page {
        border-radius: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="hero-content">
        <p class="hero-title">社内AI勉強会 2024</p>
        <p class="hero-subtitle">
          生成AIの最新動向から実務での活用例まで、チームで学び合うインタラクティブな勉強会です。
        </p>
      </div>
    </section>
    <section class="content">
      <span class="badge">社内イベント告知</span>
      <div class="info-grid">
        <article class="info-card">
          <p class="info-label">Title</p>
          <p class="info-value">AI勉強会「仕事を変えるプロンプト設計」</p>
        </article>
        <article class="info-card">
          <p class="info-label">Date & Time</p>
          <p class="info-value">2024年7月18日（木） 19:00 - 20:30</p>
        </article>
        <article class="info-card">
          <p class="info-label">Location</p>
          <p class="info-value">本社 3F イノベーションラウンジ / オンライン併用</p>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
